<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>RAEES — Custom T-Shirts & Uniforms</title>

  <meta
    name="description"
    content="RAEES Custom T-Shirts — Premium custom shirts, uniforms, jerseys and corporate apparel."
  />

  <style>
    /* =========================================================
       RESET
    ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #080808;
      color: #fff;
      overflow-x: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================================================
       VARIABLES
    ========================================================= */

    :root {
      --gold: #d4af37;
      --gold-light: #f4d878;
      --black: #080808;
      --dark: #111;
      --dark-2: #171717;
      --gray: #999;
      --white: #fff;
      --border: rgba(212, 175, 55, 0.25);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
    }

    /* =========================================================
       LOADER
    ========================================================= */

    .loader {
      position: fixed;
      inset: 0;
      background: #050505;
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.7s ease, visibility 0.7s ease;
    }

    .loader.hide {
      opacity: 0;
      visibility: hidden;
    }

    .loader-inner {
      text-align: center;
    }

    .loader-logo {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 8px;
      color: var(--gold);
      animation: logoPulse 1.5s infinite;
    }

    .loader-line {
      width: 180px;
      height: 2px;
      background: #333;
      margin: 20px auto;
      overflow: hidden;
    }

    .loader-line::after {
      content: "";
      display: block;
      width: 70px;
      height: 100%;
      background: var(--gold);
      animation: loading 1.2s infinite;
    }

    @keyframes loading {
      0% {
        transform: translateX(-80px);
      }

      100% {
        transform: translateX(200px);
      }
    }

    @keyframes logoPulse {
      0%,
      100% {
        opacity: 0.5;
      }

      50% {
        opacity: 1;
      }
    }

    /* =========================================================
       CURSOR GLOW
    ========================================================= */

    .cursor-glow {
      position: fixed;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(212, 175, 55, 0.12),
        transparent 65%
      );
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 1;
    }

    /* =========================================================
       NAVBAR
    ========================================================= */

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 5000;
      background: rgba(5, 5, 5, 0.82);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.12);
    }

    .navbar {
      max-width: 1250px;
      margin: auto;
      min-height: 78px;
      padding: 0 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: 4px;
      color: var(--gold);
    }

    .logo span {
      display: block;
      color: #fff;
      font-size: 9px;
      letter-spacing: 3px;
      margin-top: 3px;
    }

    .nav-links {
      display: flex;
      gap: 30px;
      list-style: none;
    }

    .nav-links a {
      color: #ddd;
      font-size: 14px;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: var(--gold);
    }

    .cart-button {
      border: 1px solid var(--gold);
      background: transparent;
      color: var(--gold);
      padding: 11px 17px;
      border-radius: 30px;
      transition: 0.3s;
      position: relative;
    }

    .cart-button:hover {
      background: var(--gold);
      color: #000;
    }

    .cart-count {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      color: #000;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .menu-btn {
      display: none;
      background: transparent;
      border: none;
      color: white;
      font-size: 25px;
    }

    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 75% 30%, rgba(212,175,55,0.13), transparent 35%),
        linear-gradient(120deg, #050505, #111, #050505);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 50px 50px;
      mask-image: linear-gradient(to bottom, black, transparent);
    }

    .hero-container {
      width: 100%;
      max-width: 1250px;
      margin: auto;
      padding: 140px 25px 80px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    .hero-content {
      animation: heroText 1s ease forwards;
    }

    @keyframes heroText {
      from {
        opacity: 0;
        transform: translateX(-60px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .eyebrow {
      color: var(--gold);
      font-size: 13px;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: clamp(50px, 7vw, 90px);
      line-height: 0.95;
      letter-spacing: -4px;
      margin-bottom: 25px;
    }

    .hero h1 span {
      color: var(--gold);
    }

    .hero-text {
      color: #aaa;
      max-width: 540px;
      line-height: 1.8;
      margin-bottom: 35px;
    }

    .hero-buttons {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      padding: 15px 25px;
      border-radius: 4px;
      font-weight: bold;
      transition: 0.35s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-gold {
      background: var(--gold);
      color: #050505;
    }

    .btn-gold:hover {
      background: var(--gold-light);
      transform: translateY(-4px);
      box-shadow: 0 15px 30px rgba(212, 175, 55, 0.2);
    }

    .btn-outline {
      background: transparent;
      color: white;
      border: 1px solid #444;
    }

    .btn-outline:hover {
      border-color: var(--gold);
      color: var(--gold);
      transform: translateY(-4px);
    }

    .hero-visual {
      position: relative;
      min-height: 540px;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: heroImage 1.2s ease forwards;
    }

    @keyframes heroImage {
      from {
        opacity: 0;
        transform: translateY(70px) scale(0.9);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .hero-circle {
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      border: 1px solid rgba(212, 175, 55, 0.25);
      animation: rotateCircle 18s linear infinite;
    }

    .hero-circle::before,
    .hero-circle::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 20px var(--gold);
    }

    .hero-circle::before {
      top: 25px;
      left: 50%;
    }

    .hero-circle::after {
      bottom: 25px;
      right: 50%;
    }

    @keyframes rotateCircle {
      to {
        transform: rotate(360deg);
      }
    }

    .hero-image {
      width: min(520px, 90%);
      height: 540px;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 30px 100px rgba(0, 0, 0, 0.8);
      position: relative;
      z-index: 2;
    }

    .floating-card {
      position: absolute;
      right: 0;
      bottom: 20px;
      z-index: 3;
      padding: 18px 22px;
      background: rgba(15, 15, 15, 0.9);
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
      border-radius: 8px;
      animation: floatCard 3s ease-in-out infinite;
    }

    @keyframes floatCard {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-15px);
      }
    }

    .floating-card strong {
      color: var(--gold);
      display: block;
      font-size: 20px;
    }

    .floating-card small {
      color: #999;
    }

    /* =========================================================
       MARQUEE
    ========================================================= */

    .marquee {
      background: var(--gold);
      color: #050505;
      overflow: hidden;
      padding: 14px 0;
      white-space: nowrap;
    }

    .marquee-track {
      display: inline-flex;
      gap: 50px;
      animation: marquee 20s linear infinite;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    @keyframes marquee {
      to {
        transform: translateX(-50%);
      }
    }

    /* =========================================================
       SECTION
    ========================================================= */

    section {
      padding: 110px 25px;
      position: relative;
    }

    .container {
      max-width: 1250px;
      margin: auto;
    }

    .section-heading {
      margin-bottom: 50px;
    }

    .section-heading small {
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 4px;
    }

    .section-heading h2 {
      font-size: clamp(36px, 5vw, 62px);
      margin-top: 10px;
    }

    .section-heading p {
      color: #888;
      max-width: 600px;
      margin-top: 15px;
      line-height: 1.7;
    }

    /* =========================================================
       SERVICES
    ========================================================= */

    .services {
      background: #0b0b0b;
    }

    .service-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .service-card {
      background: linear-gradient(145deg, #151515, #0d0d0d);
      border: 1px solid #222;
      padding: 30px;
      min-height: 220px;
      transition: 0.4s;
      position: relative;
      overflow: hidden;
    }

    .service-card::after {
      content: "";
      position: absolute;
      width: 100px;
      height: 100px;
      background: rgba(212,175,55,0.08);
      border-radius: 50%;
      right: -40px;
      bottom: -40px;
    }

    .service-card:hover {
      transform: translateY(-10px);
      border-color: var(--gold);
    }

    .service-number {
      color: var(--gold);
      font-size: 13px;
    }

    .service-card h3 {
      margin: 35px 0 12px;
      font-size: 22px;
    }

    .service-card p {
      color: #888;
      line-height: 1.6;
      font-size: 14px;
    }

    /* =========================================================
       PRODUCTS
    ========================================================= */

    .products {
      background: #050505;
    }

    .product-tools {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 35px;
      flex-wrap: wrap;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: #111;
      border: 1px solid #292929;
      color: #aaa;
      padding: 10px 17px;
      border-radius: 30px;
      transition: 0.3s;
    }

    .filter-btn.active,
    .filter-btn:hover {
      color: #000;
      background: var(--gold);
      border-color: var(--gold);
    }

    .search-box {
      background: #111;
      border: 1px solid #292929;
      color: white;
      padding: 12px 16px;
      border-radius: 4px;
      width: 240px;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--gold);
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px;
    }

    .product-card {
      background: #111;
      border: 1px solid #222;
      overflow: hidden;
      position: relative;
      transition: 0.4s;
      border-radius: 6px;
    }

    .product-card:hover {
      transform: translateY(-8px);
      border-color: rgba(212,175,55,0.6);
      box-shadow: var(--shadow);
    }

    .product-image-wrap {
      height: 320px;
      background: #181818;
      overflow: hidden;
      position: relative;
    }

    .product-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: 0.6s;
    }

    .product-card:hover .product-image {
      transform: scale(1.06);
    }

    .product-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--gold);
      color: #000;
      padding: 6px 10px;
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .product-info {
      padding: 20px;
    }

    .product-category {
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .product-info h3 {
      margin: 9px 0;
      font-size: 19px;
    }

    .product-info p {
      color: #777;
      font-size: 13px;
      line-height: 1.5;
      min-height: 40px;
    }

    .product-bottom {
      margin-top: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .price {
      color: var(--gold);
      font-size: 20px;
      font-weight: bold;
    }

    .add-cart {
      border: 1px solid var(--gold);
      background: transparent;
      color: var(--gold);
      padding: 9px 12px;
      border-radius: 4px;
      transition: 0.3s;
      font-size: 12px;
      font-weight: bold;
    }

    .add-cart:hover {
      background: var(--gold);
      color: #000;
    }

    .no-products {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px;
      color: #777;
    }

    /* =========================================================
       ABOUT
    ========================================================= */

    .about {
      background: #0b0b0b;
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }

    .about-box {
      border: 1px solid #222;
      padding: 45px;
      background: linear-gradient(145deg, #131313, #090909);
    }

    .about-box h3 {
      font-size: 35px;
      margin-bottom: 20px;
    }

    .about-box p {
      color: #888;
      line-height: 1.8;
      margin-bottom: 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 25px;
    }

    .stat {
      border: 1px solid #222;
      padding: 22px;
    }

    .stat strong {
      display: block;
      color: var(--gold);
      font-size: 30px;
    }

    .stat span {
      color: #777;
      font-size: 12px;
    }

    /* =========================================================
       CONTACT
    ========================================================= */

    .contact {
      background: #050505;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 0.8fr 1.2fr;
      gap: 30px;
    }

    .contact-info,
    .contact-form {
      background: #111;
      border: 1px solid #222;
      padding: 35px;
    }

    .contact-info h3 {
      font-size: 30px;
      margin-bottom: 20px;
    }

    .contact-info p {
      color: #888;
      line-height: 1.7;
    }

    .contact-item {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #222;
    }

    .contact-item span {
      color: var(--gold);
      font-size: 12px;
      display: block;
      margin-bottom: 5px;
    }

    .contact-form {
      display: grid;
      gap: 15px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .contact-form input,
    .contact-form textarea,
    .contact-form select,
    .checkout-form input,
    .checkout-form textarea {
      width: 100%;
      background: #080808;
      border: 1px solid #292929;
      color: white;
      padding: 14px;
      outline: none;
      border-radius: 3px;
    }

    .contact-form textarea,
    .checkout-form textarea {
      min-height: 120px;
      resize: vertical;
    }

    .contact-form input:focus,
    .contact-form textarea:focus,
    .contact-form select:focus {
      border-color: var(--gold);
    }

    /* =========================================================
       FOOTER
    ========================================================= */

    footer {
      background: #030303;
      border-top: 1px solid #181818;
      padding: 50px 25px 25px;
    }

    .footer-grid {
      max-width: 1250px;
      margin: auto;
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr 1fr;
      gap: 40px;
    }

    .footer-brand p {
      color: #666;
      line-height: 1.7;
      margin-top: 15px;
      max-width: 350px;
    }

    footer h4 {
      color: var(--gold);
      margin-bottom: 17px;
    }

    footer li {
      list-style: none;
      color: #777;
      margin: 10px 0;
      font-size: 14px;
    }

    .copyright {
      max-width: 1250px;
      margin: 45px auto 0;
      padding-top: 20px;
      border-top: 1px solid #181818;
      color: #555;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      gap: 15px;
    }

    /* =========================================================
       CART OVERLAY
    ========================================================= */

    .cart-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 8000;
      opacity: 0;
      visibility: hidden;
      transition: 0.3s;
    }

    .cart-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .cart-panel {
      position: absolute;
      top: 0;
      right: 0;
      width: min(450px, 100%);
      height: 100%;
      background: #0d0d0d;
      border-left: 1px solid var(--gold);
      transform: translateX(100%);
      transition: 0.4s ease;
      display: flex;
      flex-direction: column;
    }

    .cart-overlay.open .cart-panel {
      transform: translateX(0);
    }

    .cart-header {
      padding: 22px;
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-header h3 {
      font-size: 22px;
    }

    .close-cart {
      background: transparent;
      color: #aaa;
      border: none;
      font-size: 28px;
    }

    .close-cart:hover {
      color: var(--gold);
    }

      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
